# 로컬 실행용. 아래 계정 정보는 이 프로젝트 전용 연습값이므로 다른 곳에 재사용하지 마세요.
#
#   DB만 실행 (개발용):        docker compose up -d
#   전체 실행 (DB+API+화면):   docker compose --profile full up -d --build
#   스키마 재적용이 필요하면:  docker compose down -v 후 다시 up (볼륨 삭제 주의)
services:
  mysql:
    image: mysql:8.0
    container_name: gasdrift-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-local-only
      MYSQL_DATABASE: gasdrift
      MYSQL_USER: gasdrift
      MYSQL_PASSWORD: gasdrift1234
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # PC에 이미 설치된 MySQL(3306)과 겹치지 않도록 호스트 포트는 3307을 사용한다.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-local-only"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: ["full"]
    build: ./backend
    container_name: gasdrift-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 컨테이너끼리는 서비스 이름(mysql)과 컨테이너 내부 포트(3306)로 접속한다.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gasdrift?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      GASDRIFT_DB_PASSWORD: gasdrift1234
    ports:
      - "8080:8080"

  frontend:
    profiles: ["full"]
    build: ./frontend
    container_name: gasdrift-frontend
    depends_on:
      - backend
    ports:
      # Spring 의 CORS 설정이 허용하는 3000 번을 사용한다.
      - "3000:80"

volumes:
  mysql-data:
